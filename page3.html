        body {
        background-image: url('https://obmontessori.orangeapps.ph/landing/obmontessori/images/FV%20Facade.jpg');
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment: fixed;
        }

        .logo {
            position: absolute;
            width: 560px;
            height: 136px;
            left: 0;
            top: 7px;
            background: url("logo.png") no-repeat center;
        }

        .container.bg-light {
            max-width: 1100px;
            padding: 40px 45px;
            margin-top: 40px;
            margin-bottom: 60px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.18);
        }

        h2 {
            font-weight: 600;
            color: #184f88;
            margin-bottom: 25px;
            margin-top: 30px;
            letter-spacing: 0.5px;
        }


        label {
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 6px;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14px;
            border: 1px solid #d0d0d0;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #184f88;
            box-shadow: 0 0 0 0.15rem rgba(24,79,136,0.2);
        }

        .form-check-label {
            font-size: 14px;
            color: #333;
        }

        .form-check-input:checked {
            background-color: #184f88;
            border-color: #184f88;
        }

        input[type="submit"] {
            background: linear-gradient(90deg, #0c4579, #184f88);
            color: white;
            font-weight: 600;
            padding: 12px 30px;
            border-radius: 25px;
            border: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.25);
        }


        .row {
            margin-bottom: 10px;
        }

    </style>

</head>

        <form>

        <div class="row">

        <div class="col mb-3 mt-3">
            <label for="text">First Name</label>
            <input type="text" class="form-control" placeholder="Insert first name here">
        
        </div>


        <div class="col mb-3 mt-3">
            <label for="text">Last Name</label>
            <input type="text" class="form-control" placeholder="Insert last name here">
        
        </div>

        <div class="row">

        </div>

    <div class="col mb-3 mt-3">

            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>

      </div>

      <div class="col mb-3 mt-3">
        <label>Grade level</label>

            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
            <option>9</option>
            <option>10</option>
            <option>11</option>
            <option>12</option>
          </select>


      </div>

      <div class="col mb-3 mt-3">
        <label for="text">Previous School</label>  
        <input type="text" class="form-control" placeholder="ex. Ateneo">
      
      </div>

        <div class="col mb-3 mt-3">
        <label for="text">Extra info needed (allergies, SPED, etc)</label>  
        <input type="text" class="form-control" placeholder="ex. allergic to shrimp">
      
      </div>
      
<div class="container mt-3">
